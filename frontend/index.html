<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mbt-mdwiki 文档站</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Noto Sans SC", sans-serif; background: #111518; color: #d8dfda; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111518; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; border: 1px solid #5b704e; background: #263322; color: #dce8d2; padding: 8px 12px; border-radius: 3px; }
    button:hover:not(:disabled) { background: #34462c; border-color: #8ea976; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    input, textarea { width: 100%; border: 1px solid #3b4940; background: #171c1e; color: #dfe7e1; padding: 10px; border-radius: 3px; }
    textarea { resize: vertical; min-height: 28rem; line-height: 1.65; font-family: "Noto Sans Mono", monospace; }
    a { color: #91bdde; }
    .client-shell { min-height: 100vh; }
    .client-header { display: grid; grid-template-columns: minmax(13rem, .8fr) minmax(16rem, 1.5fr) auto; gap: 14px; align-items: center; padding: 15px 24px; background: #182d22; border-bottom: 1px solid #33493a; }
    .client-header h1 { margin: 0; font-size: 1.12rem; font-weight: 600; color: #e4ede3; letter-spacing: .02em; }
    .client-header input { background: #121916; }
    .client-shell > p { margin: 0; padding: 9px 24px; min-height: 2.35rem; border-bottom: 1px solid #2c3832; color: #9daaa1; font-size: .88rem; }
    .workspace { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); min-height: calc(100vh - 6.1rem); }
    .sidebar { padding: 22px 14px; border-right: 1px solid #2b3630; background: #192319; overflow: auto; }
    .sidebar h2 { margin: 4px 8px 12px; font-size: .78rem; color: #a9b997; letter-spacing: .08em; }
    .sidebar input, .sidebar button { margin-bottom: 10px; }
    .document-button, .result-button { display: block; width: 100%; text-align: left; border-color: transparent; background: transparent; color: #bbc8bc; overflow-wrap: anywhere; }
    .document-button:hover, .result-button:hover { background: #2b3c2b; color: #edf5e8; }
    .editor-panel { padding: 34px clamp(22px, 6vw, 92px); max-width: 1100px; width: 100%; }
    .editor-panel h2 { margin: 0 0 22px; color: #f0f4f0; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 500; }
    .editor-panel > textarea { min-height: 30rem; background: #171b1d; border-color: #3e4b45; font-size: .98rem; }
    .editor-actions { display: grid; grid-template-columns: minmax(16rem, 1fr) auto auto auto; gap: 9px; margin-top: 12px; align-items: center; }
    .editor-actions input { min-width: 0; }
    .document-list:empty::after { content: "加载后显示文档"; display: block; padding: 8px; color: #6e7b71; font-size: .86rem; }
    .search-results { margin-top: 4px; }
    @media (max-width: 760px) {
      .client-header { grid-template-columns: 1fr; padding: 14px; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid #2b3630; }
      .editor-panel { padding: 24px 14px; }
      .editor-actions { grid-template-columns: 1fr 1fr; }
      .editor-actions input { grid-column: 1 / -1; }
      textarea { min-height: 20rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/frontend.js"></script>
</body>
</html>
