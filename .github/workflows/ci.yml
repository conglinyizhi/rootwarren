name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: moonbitlang/moon@v1
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Check
        run: MOON_CC=clang moon check
      - name: Test
        run: MOON_CC=clang moon test
